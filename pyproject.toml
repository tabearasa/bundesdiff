[project]
name = "bundesdiff"
version = "0.1.0"
description = "Synopse (Diff-Ansicht) für Änderungen im Bundesgesetzblatt"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pymupdf>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.3",
]

[project.scripts]
bundesdiff = "bundesdiff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bundesdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spec(*ids): the spec requirements (specs/*.md) this test proves"]
# a failing browser test keeps a screenshot and a trace (open with `uv run playwright show-trace`)
addopts = "--screenshot only-on-failure --tracing retain-on-failure --output test-results/failures"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Only rules that find real mistakes (unused names, undefined names, syntax errors) – not style.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["bundesdiff"]
