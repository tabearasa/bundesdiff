# Runs all tests on every push and pull request: the Python tests and the browser
# tests of the frontend (see tests/frontend/) in all three browser engines –
# Chromium (Chrome, Edge, Android), Firefox and WebKit (Safari on iPhone, iPad, Mac).
# The screenshots of every page, screen size and theme are kept as an artifact.
# The coverage (measured in the Chromium run) is shown on the run's summary page.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: |
          uv sync --frozen
          uv run playwright install --with-deps ${{ matrix.browser }}
          # WebKit on Linux hyphenates with the system's dictionaries, and the runner has only the
          # English ones. Safari on iPhone and Mac has German built in, as Chromium and Firefox do.
          if [ "${{ matrix.browser }}" = webkit ]; then sudo apt-get install -y --no-install-recommends hyphen-de; fi

      # Coverage once is enough: the Python code runs the same in every browser job.
      # The browser tests serve static files, so app.js is not part of the number.
      - name: Test
        run: |
          if [ "${{ matrix.browser }}" = chromium ]; then cov="--cov --cov-report=json:coverage.json"; fi
          uv run pytest --browser ${{ matrix.browser }} $cov

      # also after failed tests: pytest-cov still writes the report
      - name: Show coverage on the summary page
        if: always() && matrix.browser == 'chromium'
        run: |
          if [ -f coverage.json ]; then
            python3 -c "import json; t = json.load(open('coverage.json'))['totals']; print(f\"**Coverage of the Python code:** {t['percent_covered_display']} % ({t['covered_lines']} of {t['num_statements']} lines)\")" >> "$GITHUB_STEP_SUMMARY"
          fi

      # only when something failed: the screenshots and traces show what the browser drew,
      # the only way to see WebKit, which does not run on every developer machine
      - name: Upload screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-screenshots-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Ruff
        run: |
          uv sync --frozen
          uv run ruff check bundesdiff tests
