  <template id="tpl-intro">
    <section class="welcome tl-intro">
      <p class="masthead-name name">bundesdiff</p>
      <h1>Was ändert sich im Gesetz?</h1>
      <p class="lead">
        Neue Gesetze und Änderungen erscheinen im <strong>Bundesgesetzblatt</strong>. Dort steht meist nur eine
        Anweisung wie „In § 4 wird „zwei Monate“ durch „fünf Wochen“ ersetzt“. <span class="name">bundesdiff</span> arbeitet die Änderung
        in das Gesetz ein und zeigt <del class="sample">vorher</del> und <ins class="sample">nachher</ins> nebeneinander.
      </p>
      <p class="tl-help"><button class="linklike" data-help="">So funktioniert's – und was die Fachbegriffe bedeuten</button></p>
    </section>
  </template>

  <template id="tpl-help">
    <section id="help-how">
      <h3>Wie entsteht die Gegenüberstellung?</h3>
      <ol class="pipeline">
        <li><strong>Veröffentlichung holen.</strong> Das amtliche PDF wird von <span class="domain">recht.bund.de</span> geladen, der offiziellen Plattform des Bundesgesetzblatts.</li>
        <li><strong>Anweisungen erkennen.</strong> Der Text wird in seine Artikel zerlegt. Jede Änderungsanweisung („… wird gestrichen“, „Nach Absatz 3 wird folgender Absatz eingefügt …“) wird erkannt: <em>was</em> geändert wird, <em>wo</em> und <em>wie</em>.</li>
        <li><strong>Betroffenes Gesetz finden.</strong> Der aktuelle Text des geänderten Gesetzes wird aus dem Rechtsinformationsportal des Bundes oder von <span class="domain">gesetze-im-internet.de</span> geladen.</li>
        <li><strong>Vorher und Nachher bestimmen.</strong> Diese Datenbanken werden meist innerhalb weniger Tage aktualisiert. <span class="name">bundesdiff</span> prüft daher für jede Vorschrift, ob der aktuelle Text die Änderung schon enthält:
          <ul>
            <li><span class="badge applied">neuer Text berechnet</span> Noch nicht enthalten: Der aktuelle Text ist „Vorher“, der neue Text wird durch Anwenden der Anweisungen berechnet.</li>
            <li><span class="badge consolidated">alter Text rekonstruiert</span> Schon enthalten: Der aktuelle Text ist „Nachher“, der alte Text wird zurückgerechnet – notfalls mithilfe einer archivierten älteren Fassung (Internet Archive).</li>
          </ul>
        </li>
        <li><strong>Vergleichen.</strong> Beide Fassungen werden Abschnitt für Abschnitt und Wort für Wort verglichen. Was wegfällt, ist durchgestrichen; was neu hinzukommt, ist unterstrichen.</li>
      </ol>
    </section>
    <section id="help-status">
      <h3>Was bedeuten die Markierungen?</h3>
      <dl class="legend">
        <div><dt><span class="badge applied">neuer Text berechnet</span></dt><dd>Das Gesetz im Internet ist noch nicht aktualisiert; <span class="name">bundesdiff</span> zeigt, wie es nach der Änderung lauten wird.</dd></div>
        <div><dt><span class="badge consolidated">alter Text rekonstruiert</span></dt><dd>Das Gesetz im Internet ist schon aktualisiert; <span class="name">bundesdiff</span> zeigt zusätzlich, wie es vorher lautete.</dd></div>
        <div><dt><span class="badge failed">nicht anwendbar</span></dt><dd>Die Anweisung passte nicht zum Gesetzestext (z. B. ungewöhnliche Formulierung). Sie ist nur im Wortlaut zu sehen.</dd></div>
        <div><dt><span class="badge unsupported">nicht dargestellt</span></dt><dd>Änderungen an Inhaltsverzeichnissen, Anlagen und Tabellen werden nicht gegenübergestellt.</dd></div>
        <div><dt><del class="sample">durchgestrichen</del></dt><dd>Text, der wegfällt.</dd></div>
        <div><dt><ins class="sample">unterstrichen</ins></dt><dd>Text, der neu hinzukommt.</dd></div>
      </dl>
    </section>
    <section id="help-terms">
      <h3>Kleines Wörterbuch</h3>
      <dl class="glossary">
        <dt>Bundesgesetzblatt (BGBl.)</dt><dd>Das amtliche Veröffentlichungsblatt des Bundes. Erst mit der Veröffentlichung dort („Verkündung“) wird ein Gesetz wirksam. <span class="name">bundesdiff</span> zeigt Teil I – die Gesetze und Verordnungen für Deutschland.</dd>
        <dt>Gesetz / Verordnung</dt><dd>Ein Gesetz beschließt der Bundestag. Eine Verordnung erlässt die Regierung oder ein Ministerium auf Grundlage eines Gesetzes – sie regelt meist Details.</dd>
        <dt>Änderungsgesetz</dt><dd>Ein Gesetz, das bestehende Gesetze ändert. Es enthält nicht den neuen Gesamttext, sondern nur die Anweisungen, was zu ändern ist.</dd>
        <dt>Artikel</dt><dd>Ein Änderungsgesetz ist in Artikel gegliedert; oft ändert jeder Artikel ein anderes Gesetz. Der letzte Artikel regelt meist, ab wann alles gilt („Inkrafttreten“).</dd>
        <dt>§ (Paragraf), Absatz, Satz, Nummer</dt><dd>Die Gliederung eines Gesetzes: Ein Paragraf hat Absätze – geschrieben (1), (2) –, Absätze bestehen aus Sätzen und enthalten oft Aufzählungen mit Nummern (1., 2.) und Buchstaben (a), b)).</dd>
        <dt>Fassung</dt><dd>Der Wortlaut eines Gesetzes zu einem bestimmten Zeitpunkt. „Bisherige Fassung“ = vor der Änderung, „neue Fassung“ = danach.</dd>
        <dt>Inkrafttreten</dt><dd>Der Tag, ab dem eine Regelung gilt. Er kann nach der Veröffentlichung liegen.</dd>
        <dt>„(weggefallen)“</dt><dd>Platzhalter für eine aufgehobene Vorschrift, damit sich die Nummerierung der übrigen nicht verschiebt.</dd>
        <dt>Synopse</dt><dd>Fachwort für die Gegenüberstellung von alter und neuer Fassung – das, was <span class="name">bundesdiff</span> erzeugt.</dd>
        <dt>Gesetzentwurf</dt><dd>Ein Vorschlag für ein neues Gesetz oder für die Änderung bestehender Gesetze. Er gilt noch nicht: Der Bundestag berät ihn und kann ihn ändern, beschließen oder ablehnen. Erst das beschlossene und im Bundesgesetzblatt veröffentlichte Gesetz gilt.</dd>
        <dt>Drucksache</dt><dd>So heißen die Unterlagen des Bundestages, zum Beispiel ein Gesetzentwurf. Jede hat eine Nummer: „21/6588“ ist die Drucksache 6588 der 21. Wahlperiode – das ist die Zeit zwischen zwei Bundestagswahlen.</dd>
        <dt>Vorblatt und Begründung</dt><dd>Ein Gesetzentwurf beginnt mit einer kurzen Zusammenfassung, dem Vorblatt, und endet mit einer Begründung. Beides schreibt, wer den Entwurf vorlegt – zum Beispiel die Bundesregierung.</dd>
      </dl>
    </section>
    <section id="help-sources">
      <h3>Quellen und Grenzen</h3>
      <p>Daten stammen von <span class="domain">recht.bund.de</span> (Bundesgesetzblatt), dem Rechtsinformationsportal des Bundes (<span class="domain">testphase.<wbr>rechtsinformationen.<wbr>bund.de</span>), <span class="domain">gesetze-im-internet.de</span> und dem Internet Archive (<span class="domain">archive.org</span>). Gesetzentwürfe stammen vom Deutschen Bundestag (<span class="domain">dserver.<wbr>bundestag.de</span>). Alles wird automatisch ausgewertet und kann Fehler enthalten. Rechtsverbindlich ist allein das amtliche Bundesgesetzblatt.</p>
    </section>
  </template>

  <template id="tpl-about">
    <section class="welcome about">
      <h1>Über <span class="name">bundesdiff</span></h1>
      <h2>Wozu gibt es <span class="name">bundesdiff</span>?</h2>
      <p>
        Wenn ein Gesetz geändert wird, steht im Bundesgesetzblatt meist nicht der neue Text, sondern nur eine Anweisung,
        <em>wie</em> der alte Text zu ändern ist. <span class="name">bundesdiff</span> arbeitet diese Anweisungen ein und zeigt den bisherigen und
        den neuen Text nebeneinander – damit alle nachvollziehen können, was sich ändert, auch ohne juristische Ausbildung.
      </p>
      <h2>Ohne Gewähr</h2>
      <p>
        <span class="name">bundesdiff</span> ist kein amtliches Angebot und keine Rechtsberatung. Alles wird automatisch ausgewertet und kann Fehler
        enthalten. Rechtsverbindlich ist allein das amtliche Bundesgesetzblatt.
      </p>
      <h2>Woher kommen die Daten?</h2>
      <ul>
        <li><a href="https://www.recht.bund.de" target="_blank" rel="noopener"><span class="domain">recht.bund.de</span></a> – die amtliche Plattform des Bundesgesetzblatts. Von dort stammen die Veröffentlichungen.</li>
        <li><a href="https://testphase.rechtsinformationen.bund.de" target="_blank" rel="noopener">Rechtsinformationsportal des Bundes</a> und <a href="https://www.gesetze-im-internet.de" target="_blank" rel="noopener"><span class="domain">gesetze-im-internet.de</span></a> – der aktuelle Text der geänderten Gesetze.</li>
        <li><a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a> – ältere Fassungen, wenn der bisherige Text anders nicht zu bekommen ist.</li>
        <li><a href="https://www.bundestag.de" target="_blank" rel="noopener">Deutscher Bundestag</a> – die Drucksachen mit den Gesetzentwürfen.</li>
      </ul>
      <h2>Darf man das?</h2>
      <p>
        Ja. Gesetze, Verordnungen und amtliche Bekanntmachungen sind „amtliche Werke“ und nicht urheberrechtlich geschützt
        (§ 5 Urheberrechtsgesetz). Das Bundesgesetzblatt darf weiterverwendet werden (§ 2 Absatz 3
        Verkündungs- und Bekanntmachungsgesetz, § 7 Datennutzungsgesetz). <span class="domain">gesetze-im-internet.de</span> und das
        Rechtsinformationsportal erlauben ausdrücklich, ihre Daten automatisch weiterzuverarbeiten.
      </p>
      <h2>Ihre Daten</h2>
      <p>
        <span class="name">bundesdiff</span> setzt keine Cookies, verwendet keine Analyse- oder Werbedienste und lädt nichts von fremden Servern.
        Nur Ihre Einstellungen – helle oder dunkle Ansicht, Darstellung der Änderungen – merkt sich Ihr Browser auf Ihrem Gerät.
      </p>
      <h2>Quelltext</h2>
      <p class="ragged">
        Der Quelltext von <span class="name">bundesdiff</span> liegt öffentlich auf <span class="name">GitHub</span>. Unter
        <a href="https://github.com/tabearasa/bundesdiff" target="_blank" rel="noopener"><span class="domain">github.com/<wbr>tabearasa/<wbr>bundesdiff</span></a>
        können Sie nachlesen, wie die Änderungen berechnet werden, und Fehler melden.
      </p>
    </section>
  </template>
